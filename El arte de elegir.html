const norm=s=>s.toLowerCase().replace(/\s+/g," ").trim();
const gapify=t=>t.replace(/___/g,'<span class="gap">&nbsp;</span>');
function cover(){app.innerHTML=`<header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div>EL ARTE DE ELEGIR<div class="bsub">UN VIAJE POR EL ESPAÑOL</div></div></div><div class="topnote">A2–B1 · Aprende practicando</div></header><section class="hero"><div class="hc"><div class="eyebrow">Una aventura gramatical junto al Mediterráneo</div><h1>El arte de <span>elegir</span></h1><p>Cinco misiones para dominar EL, LA, LOS, LAS, las contracciones AL y DEL y esas palabras que cambian de género entre el portugués y el español.</p><button class="btn" id="go">Empezar el viaje →</button></div><div class="bubbles" aria-hidden="true"><div class="bubble">el viaje</div><div class="bubble">la sangre</div><div class="bubble">al · del</div></div></section><section class="sec"><h2>Brújula gramatical</h2><p>Tres ideas para elegir bien. No memorices: observa.</p><div class="rules"><article class="rule"><span class="tag">ARTÍCULOS</span><h3>EL, LA, LOS, LAS</h3><p>Dependen del género y del número.</p><b>el viaje · la maleta</b></article><article class="rule"><span class="tag">CONTRACCIONES</span><h3>AL y DEL</h3><p>A + EL = AL; DE + EL = DEL. Con LA, LAS y LOS no se contrae.</p><b>al hotel · de la playa</b></article><article class="rule"><span class="tag">CASO ESPECIAL</span><h3>el agua fría</h3><p>Femenino, pero con EL en singular. En plural: LAS.</p><b>las aguas frías</b></article></div></section>`;$("go").onclick=map}
function map(){const tot=Q.length,d=Object.keys(S.res).length;
app.innerHTML=`<div class="top"><h2>Tus misiones</h2><span class="pts">${S.score} puntos</span></div><div class="bar"><i style="width:${d/tot*100}%"></i></div><div class="grid">${M.map((m,k)=>{const qs=Q.filter(q=>q[0]==k),ok=qs.filter(q=>S.res[Q.indexOf(q)]===1).length,fin=qs.every(q=>Q.indexOf(q) in S.res);
return `<button class="mc" data-k="${k}"><div class="ic">${IC[k]}</div><h3>${String(k+1).padStart(2,"0")} · ${m.n}</h3><small>${m.s}</small><p style="margin:8px 0 0">${fin?ok+" de "+qs.length+(ok>=qs.length*.8?" · Insignia de oro":ok>=qs.length*.6?" · Insignia de plata":" · Insignia de bronce"):qs.length+" desafíos"}</p></button>`}).join("")}</div>${d==tot?'<div class="row"><button class="btn" id="fin">Ver resultados</button></div>':""}`;
document.querySelectorAll(".mc").forEach(b=>b.onclick=()=>start(+b.dataset.k));if($("fin"))$("fin").onclick=final}
function start(k,rev){S.m=k;S.review=!!rev;S.i=0;S.cur=rev?S.wrong.slice():Q.map((q,j)=>j).filter(j=>Q[j][0]==k);if(!rev)S.cur.forEach(j=>delete S.res[j]);S.wrong=rev?[]:S.wrong.filter(j=>Q[j][0]!=k);show()}
let sel=[];
const sh=(a,t)=>{const bad=t.split("|").map(norm);let r,n=0;do{r=a.map(w=>({w,r:Math.random()})).sort((x,y)=>x.r-y.r).map(e=>e.w);n++}while(n<50&&(r.join(" ")==a.join(" ")||bad.includes(norm(r.join(" ")))));return r};
function show(){const j=S.cur[S.i],q=Q[j],mm=M[q[0]],n=S.cur.length;sel=[];
let body="";
if(q[1]=="m")body=`<div class="q">${gapify(q[2])}</div><div class="opts">${q[3].map((o,x)=>({o,x,r:Math.random()})).sort((a,b)=>a.r-b.r).map((e,p)=>`<button class="o" data-x="${e.x}"><span class="ol">${"ABCD"[p]}</span><span>${e.o}</span></button>`).join("")}</div>`;
if(q[1]=="o")body=`<div class="q">${q[2]}</div><div class="slot" id="slot" aria-live="polite"></div><div class="chips" id="chips">${sh(q[3],q[4]).map(w=>`<button class="chip">${w}</button>`).join("")}</div><div class="row"><button class="btn alt" id="clr">Borrar</button><button class="btn" id="chk">Comprobar</button></div>`;
if(q[1]=="w")body=`<div class="q">${gapify(q[2])}</div><input class="t" id="inp" autocomplete="off" autocapitalize="off" aria-label="Tu respuesta"><div class="row"><button class="btn" id="chk">Comprobar</button></div>`;
app.innerHTML=`<div class="play">${side(q[0])}<section class="panel"><div class="ptop"><span class="tag">${IC[q[0]]} ${S.review?"REPASO":mm.n.toUpperCase()}</span><span class="pill">✦ ${S.score} puntos</span></div><div class="bar"><i style="width:${S.i/n*100}%"></i></div><div class="kick">Desafío ${S.i+1} de ${n}</div>${S.i==0&&!S.review?`<div class="intro">${mm.i}</div>`:""}<div id="card">${body}<div id="fbx"></div></div></section></div>`;$("ex").onclick=map;
if(q[1]=="m")document.querySelectorAll(".o").forEach(b=>b.onclick=()=>answer(j,+b.dataset.x==q[4],+b.dataset.x));
if(q[1]=="o"){document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{if(b.classList.contains("used"))return;b.classList.add("used");sel.push(b.textContent);$("slot").textContent=sel.join(" ")});$("clr").onclick=()=>{sel=[];document.querySelectorAll(".chip").forEach(c=>c.classList.remove("used"));$("slot").textContent=""};$("chk").onclick=()=>{if(sel.length<q[3].length)return;answer(j,q[4].split("|").map(norm).includes(norm(sel.join(" "))))}}
if(q[1]=="w"){const f=()=>{const v=norm($("inp").value);if(v)answer(j,q[3].includes(v))};$("chk").onclick=f;$("inp").onkeydown=e=>{if(e.key=="Enter")f()};$("inp").focus()}}
function answer(j,ok,x){const q=Q[j];
document.querySelectorAll(".o,.chip,#chk,#clr,#inp").forEach(e=>e.disabled=true);
if(q[1]=="m")document.querySelectorAll(".o").forEach(b=>{const y=+b.dataset.x;if(y==q[4])b.classList.add("ok");else if(y===x)b.classList.add("no")});
if(!S.review){S.res[j]=ok?1:0;if(ok)S.score+=10;else S.wrong.push(j)}
let hint="";if(!ok){hint=q[7]=="con"?"Revisa la contracción: AL = A + EL y DEL = DE + EL; con LA, LAS y LOS no hay contracción. ":q[7]=="esp"?"Recuerda: el agua y el águila usan EL en singular, pero siguen siendo femeninas. ":"Revisa el género de la palabra. "}
const last=S.i==S.cur.length-1;
$("fbx").innerHTML=`<div class="fb ${ok?"":"bad"}"><strong>${ok?"¡Correcto!":"Casi."}</strong> ${hint}${q[5]}</div><div class="row"><button class="btn" id="nx">${last?"Terminar":"Continuar"}</button></div>`;
$("nx").focus();$("nx").onclick=()=>{S.i++;if(S.i<S.cur.length)show();else S.review?map():endM()}}
function endM(){const k=S.m,qs=Q.map((q,j)=>j).filter(j=>Q[j][0]==k),ok=qs.filter(j=>S.res[j]===1).length;
app.innerHTML=`<div class="card" style="text-align:center"><div class="big">${ok} / ${qs.length}</div><h2>${M[k].n}</h2><p>${ok>=qs.length*.8?"Insignia de oro. ¡Excelente elección!":ok>=qs.length*.6?"Insignia de plata. Muy buen camino.":"Insignia de bronce. Cada error te enseña algo."}</p><div class="row" style="justify-content:center"><button class="btn" id="b1">Volver al mapa</button>${k<4?'<button class="btn alt" id="b2">Siguiente misión</button>':""}</div></div>`;
$("b1").onclick=map;if($("b2"))$("b2").onclick=()=>start(k+1)}
function final(){const tot=Q.length,ok=Object.values(S.res).filter(v=>v===1).length,het=new Set(),cat={art:0,con:0,esp:0};
Q.forEach((q,j)=>{if(S.res[j]===0){cat[q[7]]++;if(q[6])q[6].split(", ").forEach(w=>het.add(w))}});
app.innerHTML=`<div class="card"><div style="text-align:center"><div class="big">${S.score} puntos</div><p>${ok} aciertos de ${tot}</p></div>
${M.map((m,k)=>{const qs=Q.map((q,j)=>j).filter(j=>Q[j][0]==k),o=qs.filter(j=>S.res[j]===1).length;return `<div class="res"><b>${m.n}</b><div class="bar"><i style="width:${o/qs.length*100}%;background:${m.c}"></i></div><span>${o}/${qs.length}</span></div>`}).join("")}
<h3 style="margin-top:22px">Palabras para repasar</h3><p>${het.size?[...het].map(w=>`<span class="tag">${w}</span>`).join(""):"Ninguna. ¡Todo dominado!"}</p>
<h3>Errores recurrentes</h3><p>${cat.art?`Artículos y género: ${cat.art}. `:""}${cat.con?`Contracciones AL y DEL: ${cat.con}. `:""}${cat.esp?`Agua y águila con EL: ${cat.esp}.`:""}${cat.art+cat.con+cat.esp==0?"Sin errores.":""}</p>
<p style="font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-style:italic">¡Buen trabajo! Cada palabra que aprendes te ayuda a expresarte con más naturalidad. Sigue practicando: la clave está en observar, comparar y usar el español en contexto.</p>
<div class="row">${S.wrong.length?'<button class="btn" id="rv">Revisar los errores</button>':""}<button class="btn alt" id="rs">Jugar de nuevo</button></div></div>`;
if($("rv"))$("rv").onclick=()=>start(-1,true);$("rs").onclick=()=>{S={score:0,res:{},wrong:[],cur:[],i:0,m:-1,review:false,done:{}};map()}}
function side(k){const fin=i=>Q.every((q,j)=>q[0]!=i||j in S.res);return `<aside class="side"><div class="st">Tu viaje</div>${M.map((m,i)=>`<div class="nv ${i==k?"on ":""}${fin(i)?"ok":""}"><span class="nn">${fin(i)?"✓":IC[i]}</span><span>${String(i+1).padStart(2,"0")} · ${m.n}</span></div>`).join("")}<div class="mini"><strong>Pista</strong><br>¿Masculino o femenino? ¿Singular o plural? ¿Hay A o DE antes de EL?</div><button class="btn alt" id="ex" style="width:100%;margin-top:14px">← Mapa</button></aside>`}
cover();
</script>
</body>
</html>
